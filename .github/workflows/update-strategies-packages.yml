name: Update Strategies packages

# Strategies' publish-nugets job sends repository_dispatch
# "strategies-packages-published" after it pushes packages to GitHub Packages.
# This workflow pins those versions on a bot/strategies-packages-* branch and
# opens (or updates) a PR. That PR's CI builds and tests LocalService. Nothing
# is merged automatically; a human reviews and merges.
#
# Pushes and the PR use this repo's secret M3U8_RESOLVER_BOT_TOKEN, not GITHUB_TOKEN:
# events created with GITHUB_TOKEN do not start other workflows, so CI would
# never run on the bot PR. See README "Strategies package auto-update".
on:
  repository_dispatch:
    types: [strategies-packages-published]
  workflow_dispatch:
    inputs:
      packages:
        description: 'Optional JSON map of package id to minimum version, e.g. {"VardyParty.LocalService.Abstractions":"0.2.7"}. Empty = latest stable version of every Strategies package.'
        required: false
        default: ''

concurrency:
  group: update-strategies-packages
  cancel-in-progress: false

permissions:
  contents: read

env:
  NUGET_FEED_URL: https://nuget.pkg.github.com/Vardy-Party/index.json
  BRANCH_PREFIX: bot/strategies-packages-

jobs:
  update:
    name: Pin published Strategies packages
    runs-on: ubuntu-latest

    steps:
      - name: Check bot token
        env:
          BOT_TOKEN: ${{ secrets.M3U8_RESOLVER_BOT_TOKEN }}
        run: |
          if [ -z "${BOT_TOKEN}" ]; then
            echo "::error::Repo secret M3U8_RESOLVER_BOT_TOKEN is not set. Add a fine-grained PAT for M3U8-resolver with Contents and Pull requests read/write (see README). GITHUB_TOKEN cannot be used because its PRs do not start CI."
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.M3U8_RESOLVER_BOT_TOKEN }}
          # Don't leave the PAT in .git/config for the later steps. Only the pin
          # step needs it, and it passes it to git per command.
          persist-credentials: false

      - name: Self-test updater
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -ge '5.0')) {
            # Pinned exact version from PSGallery (rarely runs: the runner images ship Pester 5).
            Install-Module Pester -RequiredVersion 5.7.1 -Repository PSGallery -Scope CurrentUser -Force
          }
          Import-Module Pester -MinimumVersion 5.0
          Invoke-Pester ./.github/scripts/StrategiesPackages.Tests.ps1 -CI

      - name: Validate dispatch source
        shell: pwsh
        env:
          SOURCE_RUN_URL: ${{ github.event.client_payload.run_url }}
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
        run: |
          . ./.github/scripts/StrategiesPackages.ps1
          # Throws on anything but a Vardy-Party/Strategies run URL plus a
          # 40-hex SHA, so payload text can never smuggle a skip-CI token or
          # arbitrary Markdown into the bot commit or PR.
          $dispatched = Assert-DispatchSource $env:SOURCE_RUN_URL $env:SOURCE_SHA
          Write-Host ($dispatched ? "Dispatched by $env:SOURCE_RUN_URL ($env:SOURCE_SHA)" : 'Manual run')

      - name: Resolve versions on the feed
        id: resolve
        shell: pwsh
        env:
          PAYLOAD_PACKAGES: ${{ toJSON(github.event.client_payload.packages) }}
          INPUT_PACKAGES: ${{ github.event.inputs.packages }}
          NUGET_USER: ${{ secrets.NUGET_GITHUB_USERNAME }}
          NUGET_TOKEN: ${{ secrets.NUGET_GITHUB_TOKEN }}
        run: |
          . ./.github/scripts/StrategiesPackages.ps1
          if ([string]::IsNullOrWhiteSpace($env:NUGET_TOKEN)) { throw 'Repo secret NUGET_GITHUB_TOKEN (read:packages) is not set.' }
          $feedUser = if ($env:NUGET_USER) { $env:NUGET_USER } else { 'x-access-token' }
          # All five Strategies ids, every run. The payload only sets minimums
          # to wait for, so a dispatch that GitHub coalesced away is still covered.
          $requested = Get-RequestedVersions $env:PAYLOAD_PACKAGES $env:INPUT_PACKAGES
          Write-Host "Minimums to wait for: $($requested | ConvertTo-Json -Compress)"
          $getVersions = { param($id) Get-FeedPackageVersions $id $env:NUGET_FEED_URL $feedUser $env:NUGET_TOKEN }
          $targets = Resolve-TargetVersions $requested $getVersions
          Write-Host "Pinning: $($targets | ConvertTo-Json -Compress)"
          "targets=$($targets | ConvertTo-Json -Compress)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Pin on bot branch and open or update PR
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.M3U8_RESOLVER_BOT_TOKEN }}
          TARGETS: ${{ steps.resolve.outputs.targets }}
          SOURCE_RUN_URL: ${{ github.event.client_payload.run_url }}
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          . ./.github/scripts/StrategiesPackages.ps1
          $dispatched = Assert-DispatchSource $env:SOURCE_RUN_URL $env:SOURCE_SHA
          # Commits are pushed with Vardy-Party's PAT, so say so: not github-actions[bot].
          git config user.name 'Vardy-Party (strategies-packages bot)'
          git config user.email 'vardyparty@users.noreply.github.com'
          # The checkout keeps no credentials (persist-credentials: false), so
          # git commands that talk to GitHub get the PAT here, one at a time.
          $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$($env:GH_TOKEN)"))
          Write-Host "::add-mask::$basic"
          function Invoke-GitAuth { git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" @args }
          $targets = [ordered]@{}
          $parsed = $env:TARGETS | ConvertFrom-Json -AsHashtable
          foreach ($id in @($parsed.Keys | Sort-Object)) { $targets[$id] = $parsed[$id] }

          # Pick the branch (decision tested in StrategiesPackages.Tests.ps1).
          # Never force-push: an existing branch is reused and main merged into it.
          $open = @(gh pr list --repo $env:GITHUB_REPOSITORY --state open --base main --json number,headRefName,url | ConvertFrom-Json |
            Where-Object { $_.headRefName.StartsWith($env:BRANCH_PREFIX) }) | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw 'gh pr list failed' }
          $remote = @(Invoke-GitAuth ls-remote --heads origin "$($env:BRANCH_PREFIX)*" | ForEach-Object { ($_ -split "`t")[1] -replace '^refs/heads/', '' })
          $choice = Select-BotBranch ($open ? $open.headRefName : '') $remote $env:BRANCH_PREFIX $env:GITHUB_RUN_NUMBER
          $branch = $choice.Branch
          Write-Host "Branch $branch ($($choice.Mode))"
          if ($choice.Mode -eq 'new') {
            git switch -c $branch
            $base = 'origin/main'
          }
          else {
            git switch -c $branch --track "origin/$branch"
            if ($LASTEXITCODE -ne 0) { throw "Could not check out $branch" }
            # The bot token has no Workflows permission by design, and GitHub
            # rejects a push whose new commits change .github/workflows.
            $wf = @(git diff --name-only "HEAD...origin/main" -- .github/workflows)
            if ($wf.Count -gt 0) {
              throw "main changed $($wf -join ', ') since $branch was created, and the bot token cannot push workflow changes. Merge or close the bot PR, then re-run; the next run starts a fresh branch from main."
            }
            git merge --no-edit origin/main
            if ($LASTEXITCODE -ne 0) { git merge --abort; throw "main does not merge cleanly into $branch. Resolve it by hand on the PR." }
            $base = "origin/$branch"
          }

          $result = Update-PackageReferences (Get-Location).Path $targets
          $here = (Get-Location).Path
          foreach ($u in $result.Unmovable) {
            $rel = [IO.Path]::GetRelativePath($here, $u.File)
            Write-Host "::warning file=$rel::$($u.Id) not updated ($($u.Reason)$($u.Value ? ": $($u.Value)" : '')). Pin it to $($targets[$u.Id]) by hand."
          }
          $changes = @($result.Changes)
          $summary = ($targets.Keys | ForEach-Object { "$($_ -replace '^VardyParty\.LocalService\.', '') $($targets[$_])" }) -join ', '
          $title = "chore(deps): pin Strategies packages ($summary)"
          Assert-NoSkipCiToken $title 'PR title'
          if ($changes.Count -gt 0) {
            $files = @($changes | ForEach-Object { [IO.Path]::GetRelativePath($here, $_.File) } | Sort-Object -Unique)
            git add -- $files
            $lines = @($changes | ForEach-Object { "- $([IO.Path]::GetRelativePath($here, $_.File)): $($_.Id) $($_.From) -> $($_.To)" })
            $trailers = @("Run: $env:RUN_URL")
            if ($dispatched) { $trailers += "Strategies-Run: $env:SOURCE_RUN_URL"; $trailers += "Strategies-Commit: $env:SOURCE_SHA" }
            $message = (@($title, '') + $lines + @('') + $trailers) -join "`n"
            Assert-NoSkipCiToken $message 'commit message'
            $msgFile = Join-Path $env:RUNNER_TEMP 'commit-message.txt'
            Set-Content -Path $msgFile -Value $message -Encoding utf8 -NoNewline
            git commit -F $msgFile
            if ($LASTEXITCODE -ne 0) { throw 'git commit failed' }
          }

          $ahead = [int](git rev-list --count "$base..HEAD")
          if ($ahead -eq 0 -and $choice.Mode -ne 'existing-branch') {
            Write-Host "Nothing to change: every csproj already pins these versions or higher."
            exit 0
          }
          if ($ahead -gt 0) {
            Invoke-GitAuth push origin "HEAD:refs/heads/$branch"
            if ($LASTEXITCODE -ne 0) { throw "git push failed" }
          }

          $rows = @($targets.Keys | ForEach-Object { "| ``$_`` | $($targets[$_]) |" })
          $changed = if ($changes.Count -gt 0) { @($changes | ForEach-Object { "- ``$([IO.Path]::GetRelativePath($here, $_.File))``: $($_.Id) $($_.From) → $($_.To)" }) } else { @('- No pin changes in this run.') }
          $warned = @($result.Unmovable | ForEach-Object { "- ``$([IO.Path]::GetRelativePath($here, $_.File))``: $($_.Id) not updated ($($_.Reason))" })
          $trigger = if ($dispatched) { "Strategies publish run $env:SOURCE_RUN_URL (commit $env:SOURCE_SHA)" } else { 'a manual run' }
          $body = @(
            "Automated by **Update Strategies packages** ($env:RUN_URL), triggered by $trigger."
            ''
            'Highest stable versions on the GitHub Packages feed:'
            ''
            '| Package | Version |'
            '|---|---|'
          ) + $rows + @('', 'Changed in this run:', '') + $changed
          if ($warned.Count -gt 0) { $body += @('', 'References the bot could not update (pin by hand):', '') + $warned }
          $body += @('', 'CI on this PR restores these versions from the feed, then builds and tests LocalService. This workflow never merges; review and merge by hand.')
          $bodyText = $body -join "`n"
          Assert-NoSkipCiToken $bodyText 'PR body'
          $bodyFile = Join-Path $env:RUNNER_TEMP 'pr-body.md'
          Set-Content -Path $bodyFile -Value $bodyText -Encoding utf8
          if ($choice.Mode -eq 'open-pr') {
            gh pr edit $open.number --repo $env:GITHUB_REPOSITORY --title $title --body-file $bodyFile
            if ($LASTEXITCODE -ne 0) { throw 'gh pr edit failed' }
            Write-Host "Updated $($open.url)"
          }
          else {
            gh pr create --repo $env:GITHUB_REPOSITORY --base main --head $branch --title $title --body-file $bodyFile
            if ($LASTEXITCODE -ne 0) { throw 'gh pr create failed' }
          }
